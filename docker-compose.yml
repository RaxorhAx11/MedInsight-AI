version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"  # Unified production port for frontend and backend
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/medinsight
      - CLIENT_URL=http://localhost:5000
      - JWTPRIVATEKEY=${JWTPRIVATEKEY:-mySuperSecretKey123456789}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-mock_key_for_dev_testing}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    depends_on:
      - mongodb
    restart: unless-stopped

  mongodb:
    image: mongo:latest
    # Ports are omitted to keep MongoDB internal to the Docker network for security
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=medinsight
    restart: unless-stopped

volumes:
  mongodb_data: