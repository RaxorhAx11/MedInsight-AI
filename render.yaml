services:
  # Frontend Static Site Service
  - type: static
    name: medinsight-frontend
    env: static
    buildCommand: cd MedInsight/client && npm install && npm run build
    publishPath: MedInsight/client/build
    routes:
      # Rewrite all requests to index.html for SPA client-side routing
      - type: rewrite
        source: /*
        destination: /index.html

  # Backend Node Web Service
  - type: web
    name: medinsight-backend
    env: node
    buildCommand: cd MedInsight/server && npm install --omit=dev
    startCommand: cd MedInsight/server && node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWTPRIVATEKEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: CLIENT_URL
        sync: false
